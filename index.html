<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Retro Trading Terminal — Vanilla</title>

  <!-- Styles are split by module: base chrome, then one file per component -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/menu.css" />
  <link rel="stylesheet" href="css/table.css" />
  <link rel="stylesheet" href="css/statusbar.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="app__header">
      <h1 class="app__title">Retro Trading Terminal<span class="app__cursor" aria-hidden="true"></span></h1>
      <div class="app__user">
        <span class="app__desk" id="header-desk"></span>
        <span class="app__chip" id="header-user"></span>
      </div>
    </header>

    <div class="app__body">
      <aside class="app__sidebar">
        <div class="panel">
          <div class="panel__header">MARKETS NAVIGATOR<span class="panel__cursor" aria-hidden="true"></span></div>
          <nav id="tree-menu" aria-label="Markets navigator"></nav>
        </div>
      </aside>

      <main class="app__main">
        <section class="panel report" id="report-panel" hidden>
          <header class="report__header">
            <h2 class="report__title" id="report-title"></h2>
            <span class="report__asof" id="report-asof"></span>
            <span class="report__spacer"></span>
            <span class="report__status" id="report-status"></span>
            <button class="report__pause" id="report-pause" type="button" hidden></button>
          </header>
          <div class="report__body" id="report-table"></div>
        </section>

        <section class="welcome" id="welcome">
          <span class="welcome__glyph" aria-hidden="true">&#9604;&#9600;&#9604;&#9600;</span>
          <h2 class="welcome__title">No Report Loaded</h2>
          <p class="welcome__hint">Select a report from the navigator</p>
        </section>
      </main>
    </div>

    <footer id="status-bar"></footer>
  </div>

  <!--
    Native ES modules, no bundler. Only the entry point is listed: the
    browser follows the imports in js/app.js to load the rest, so script
    order no longer matters. Modules are deferred by default, which is why
    this still runs after the markup above exists.

    Note: type="module" is fetched with CORS rules, so this page must be
    served over http:// — opening index.html straight off disk (file://)
    will not work. Any static server does, e.g. `python3 -m http.server`.
  -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
